<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle City Light Project</title>


    <link href="https://unpkg.com/maplibre-gl@2.1.6/dist/maplibre-gl.css" rel='stylesheet' />

    <script src="js/maplibre-gl-compare.js"></script>

    <link rel="stylesheet" href="css/index.css">

        crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Seattle City Light</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Map</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Team</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
        <div id="before" class="map"></div>
        <div id="after" class="map"></div>

    <div class="map-overlay top">

        <div class="map-overlay-inner">
            <h5>Outage</h5>

            <input type="radio" id="one" name="first_item" value="1" checked />
            <label for="one">frequency</label>

            <input type="radio" id="one" name="first_item" value="1" />
            <label for="one">duration</label>

        </div>
        <div class="map-overlay-inner">
            <h5>Year</h5>
            <label id="month">2017</label>
            <input id="slider" type="range" min="2017" max="2023" step="1" value="0" />
            <h5>Month</h5>
            <label id="month">October</label>
            <input id="slider" type="range" min="2017" max="2023" step="1" value="0" />
            <!-- <h5>Hour</h5>
            <label id="month">12pm</label>
            <input id="slider" type="range" min="2017" max="2023" step="1" value="0" /> -->
            <h5>Time of Day</h5>

            <p>
                <input type="radio" id="one" name="first_item" value="1" checked />
                <label for="one">Morning</label>


                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Afternoon</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Evening</label>

                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Night</label>
            </p>


        </div>

        <div class="map-overlay-inner">
            <h5>Causation</h5>
            <p>
                <input type="radio" id="one" name="first_item" value="1" checked />
                <label for="one">Tree</label>

            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Car/Pole</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Vandalism</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Fire-Building</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Dig Up</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Sabotage</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Bird Animal</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Comments Required</label>
            </p>

        </div>
    </div>

    <div class="map-overlay-right top">
        <div class="map-overlay-inner">
            <h5>Equity Matrix</h5>

            <p>
                <input type="radio" id="sci" name="first_item" value="1" checked />
                <label for="one">Social Venerability</label>

            </p>
            <p>
                <input type="radio" id="hvi" name="first_item" value="2" />
                <label for="one">Socioecnomic Factor</label>
            </p>
            <p>
                <input type="radio" id="ti" name="first_item" value="3" />
                <label for="one">Transportation Insecurity</label>
            </p>
            <p>
                <input type="radio" id="evb" name="first_item" value="4" />
                <label for="one">Env. Health Disparity</label>
            </p>
            <p>
                <input type="radio" id="crb" name="first_item" value="5" />
                <label for="one">Climate Risk Burden</label>
            </p>
            <p>
                <input type="radio" id="poc" name="first_item" value="6" />
                <label for="one">Persons of Color</label>
            </p>
            <p>
                <input type="radio" id="ell" name="first_item" value="7" />
                <label for="one">English Language Learners</label>
            </p>
        </div>
    </div>
    <div class="map-overlay-bottom-right bottom">
        <div class="map-overlay-inner">
            <h5>Tract Information</h5>
            <div class="d-flex">
                <label>SVI: </label>
                <p id="svi"></p>
            </div>
            <div class="d-flex">
                <label>Racial Ethnicity:</label>
                <p id="racial_ethnic"></p>
            </div>
            <div class="d-flex">
                <label>Socioeconomic:</label>
                <p id="socioeconomic"></p>
            </div>
        </div>

    </div>

        </div> -->
</body>

</html>
