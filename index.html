<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seattle City Light Project</title>


    <link href="https://unpkg.com/maplibre-gl@2.1.6/dist/maplibre-gl.css" rel='stylesheet' />
    <link href="css/maplibre-gl-compare.css" rel='stylesheet' />

    <script src="https://unpkg.com/maplibre-gl@2.1.6/dist/maplibre-gl.js"></script>
    <script src="js/maplibre-gl-compare.js"></script>

    <link rel="stylesheet" href="css/index.css">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

    <!-- chromajs -->
    <script src="js/chroma.min.js">
    </script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Seattle City Light</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Map</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Team</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
        <div id="before" class="map"></div>
        <div id="after" class="map"></div>

    <div class="map-overlay top">

        <div class="map-overlay-inner">
            <h5>Outage</h5>
                <input type="radio" id="one" name="first_item" value="1" checked />
                <label for="one">frequency</label>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">duration</label>
        </div>
        <div class="map-overlay-inner d-flex flex-column">
            <h5>City Outlines</h5>
            <div>
                <input type="radio" id="c_tract" name="city_outlines" value="ct" checked/>
                <label for="c_tract">Census Tract</label>
            </div>
            <div>
                <input type="radio" id="city_council" name="city_outlines" value="cc"/>
                <label for="city_council">City Council</label>
            </div>
            <div>
                <input type="radio" id="neighborhood" name="city_outlines" value="nh" />
                <label for="neigborhood">Neighborhoods</label>
            </div>
        </div>
        <div class="map-overlay-inner">
            <h5>Year</h5>
            <label id="month">2017</label>
            <input id="slider" type="range" min="2017" max="2023" step="1" value="0" />
            <h5>Month</h5>
            <label id="month">October</label>
            <input id="slider" type="range" min="2017" max="2023" step="1" value="0" />
            <!-- <h5>Hour</h5>
            <label id="month">12pm</label>
            <input id="slider" type="range" min="2017" max="2023" step="1" value="0" /> -->
            <h5>Time of Day</h5>

            <p>
                <input type="radio" id="one" name="first_item" value="1" checked />
                <label for="one">Morning</label>


                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Afternoon</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Evening</label>

                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Night</label>
            </p>


        </div>

        <div class="map-overlay-inner">
            <h5>Causation</h5>
            <p>
                <input type="radio" id="one" name="first_item" value="1" checked />
                <label for="one">Tree</label>

            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Car/Pole</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Vandalism</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Fire-Building</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Dig Up</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Sabotage</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Bird Animal</label>
            </p>
            <p>
                <input type="radio" id="one" name="first_item" value="1" />
                <label for="one">Comments Required</label>
            </p>

        </div>
    </div>

    <div class="map-overlay-right top">
        <div id="equity-matrix" class="map-overlay-inner">
            <h5>Equity Matrix</h5>
            <div>
                Environment
                <div>
                    <input type="radio" id="ehd" name="population_category" value= "1" checked/>
                    <label for="ehd">Environ. Health Disparity</label>
                </div>
                <div>
                    <input type="radio" id="traffic-volume" name="population_category" value="2"/>
                    <label for="traffic-volume">Traffic Proximity & Volume</label>
                </div>
                <div>
                    <input type="radio" id="waste-proximity" name="population_category" value="3" />
                    <label for="waste-proximity">Hazardous Site Proximity</label>
                </div>
                <div>
                    <input type="radio" id="n-risk-index" name="population_category" value="4" />
                    <label for="n-risk-index">Natural Hazards Risk Index</label>
                </div>
                <div>
                    <input type="radio" id="ti" name="population_category" value="5" />
                    <label for="one">Transportation Insecurity</label>
                </div>
            </div>
            <div>
                Socialeconomic
                <div>
                    <input type="radio" id="svi" name="population_category" value="6" />
                    <label for="svi">Social Vulnerability</label>
                </div>
                <div>
                    <input type="radio" id="sef" name="population_category" value="7" />
                    <label for="sef">Socioeconomic Factor</label>
                </div>
                <div>
                    <input type="radio" id="housing-burden" name="population_category" value="8" />
                    <label for="housing-burden">Housing Burden (%)</label>
                </div>
                <div>
                    <input type="radio" id="english-learner" name="population_category" value="9" />
                    <label for="english-learner">English Learner</label>
                </div>
                <div>
                    <input type="radio" id="poc" name="population_category" value="10" />
                    <label for="poc">Persons of Color</label>
                </div>
            </div>
            <div>
                Health Factors
                <div>
                    <input type="radio" id="pm-2.5" name="population_category" value="11" />
                    <label for="pm-2.5">PM 2.5 in the Air</label>
                </div>
                <div>
                    <input type="radio" id="dpe" name="population_category" value="12" />
                    <label for="dpe">Diesel Particulate Exposure</label>
                </div>
                <div>
                    <input type="radio" id="disability" name="population_category" value="13" />
                    <label for="disability">% Disability</label>
                </div>
            </div>
        </div>
    </div>
    <div id="state-legend" class="legend">
        <div class="legend-row">
            <span style="background-color: rgb(178,24,43) "></span>
            <div>10+</div>
        </div>
        <div class="legend-row">
            <span style="background-color: rgb(189,129,140)"></span>
            <div>9-10</div>
        </div>
        <div class="legend-row">
            <span style="background-color: rgb(200,180,180)"></span>
            <div>6-9</div>
        </div>
        <div class="legend-row">
            <span style="background-color: rgb(209,229,240)"></span>
            <div>1-6</div>
        </div>
    </div>
    <div class="map-overlay-bottom-right bottom">
        <div class="map-overlay-inner">
            <h5>Tract Information</h5>
            <div class="d-flex">
                <p id="c-tract-name" class="fw-bold"></p>
            </div>
            <div class="d-flex">
                <label class="fw-bold">County Name:</label>
                <p id="countyName"></p>
            </div>
            <div class="d-flex">
                <label class="fw-bold">Population:</label>
                <p id="population"> </p>
            </div>
            <div class="d-flex">
                <label class="fw-bold">Life Expectancy:</label>
                <p id="life-expectancy"></p>
            </div>
            <div class="d-flex">
                <label class="fw-bold">Households:</label>
                <p id="households"></p>
            </div>
            <label class="fw-bold">Population by Race:</label>
            <div class="progress" style="height: 10px">
                <div id = "a-native-indian" class="progress-bar" data-bs-toggle="tooltip" data-bs-placement="top">
                </div>
                <div id = "a-asian" class="progress-bar" data-bs-toggle="tooltip" data-bs-placement="top">
                </div>
                <div id = "a-black" class="progress-bar" data-bs-toggle="tooltip" data-bs-placement="top">
                </div>
                <div id = "a-latino" class="progress-bar" data-bs-toggle="tooltip" data-bs-placement="top">
                </div>
                <div id = "a-native-pacific" class="progress-bar" data-bs-toggle="tooltip" data-bs-placement="top">
                </div>
                <div id = "a-white" class="progress-bar" data-bs-toggle="tooltip" data-bs-placement="top">
                </div>
                <div id = "a-other" class="progress-bar" data-bs-toggle="tooltip" data-bs-placement="top">
                </div>
            </div>
        </div>

    </div>
    <!-- <div id="map">
        </div> -->
</body>
<script src="js/map.js"></script>

</html>
